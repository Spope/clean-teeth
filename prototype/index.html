<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brushy Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <!-- Simulated device: 466x466 round AMOLED inside a bezel -->
    <div class="device-slot" id="slot">
      <div class="device" id="device">
        <div class="screen phase-idle" id="screen">
          <div id="stage" class="stage"><!-- everything that shakes -->
          <div class="glow"></div>
          <svg id="ring" class="layer" viewBox="0 0 466 466" aria-hidden="true"></svg>
          <div id="clock" class="clock" aria-label="Time left"><span id="clock-text" class="t-clock"></span></div>
          <svg id="germs" class="layer" viewBox="0 0 466 466" aria-hidden="true"></svg>
          <div id="fx-back" class="fx"></div><!-- sprites behind the buddy (mining block) -->
          <div id="buddy" class="buddy"><!-- tricks move this; moods and giggle live inside -->
            <div id="character" class="character"></div>
          </div>
          <div id="fx" class="fx"></div><!-- particles, sparkles, venom globs, reward drop -->
          <div id="hint" class="hint" aria-label="Tap to start">
            <svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>
          </div>
          <div id="bravo" class="bravo"><span id="bravo-text" class="t-bravo"></span></div>
          <div id="confetti" class="confetti"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Developer controls: not part of the device UI -->
    <section class="dev" aria-label="Developer controls">
      <div class="dev-row">
        <span class="dev-label">Time</span>
        <output id="dev-time">0:00 / 2:00</output>
        <span id="dev-phase" class="dev-chip">idle</span>
      </div>
      <div class="dev-row">
        <span class="dev-label">Speed</span>
        <div class="seg" id="dev-speed">
          <button data-speed="1" class="on">1×</button>
          <button data-speed="10">10×</button>
          <button data-speed="30">30×</button>
        </div>
      </div>
      <div class="dev-row">
        <span class="dev-label">Theme</span>
        <select id="dev-theme"></select>
        <label class="dev-check"><input type="checkbox" id="dev-sound" checked> Sound</label>
      </div>
      <div class="dev-row">
        <span class="dev-label">Tricks</span>
        <button data-trick="peek">Peek-a-boo</button>
        <button data-trick="peekSide">Peek side</button>
        <button data-trick="slide">Slide</button>
        <button data-trick="mine">Mine</button>
        <button data-trick="xp">XP</button>
        <button data-trick="rainbow">Rainbow</button>
        <button data-trick="fly">Fly</button>
        <button data-trick="mirror">Mirror</button>
        <button data-trick="shake">Shake</button>
      </div>
      <div class="dev-row">
        <button id="dev-skip">Skip to end</button>
        <button id="dev-stop">Back to start</button>
      </div>
    </section>
  </main>

  <script src="js/sound.js"></script>
  <script src="js/pixel.js"></script>
  <script src="themes/registry.js"></script>
  <script src="themes/minecraft.js"></script>
  <script src="themes/dragon.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
